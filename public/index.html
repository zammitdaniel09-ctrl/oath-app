<!doctype html>
<html lang="en" data-theme="oath">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oath</title>
  <meta name="description" content="Daily habits, tasks and accountability.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Oath">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preload" href="/fonts/satoshi-variable.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png?v=3" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/today.css">
  <link rel="stylesheet" href="/sheets.css">
  <link rel="stylesheet" href="/coach.css">
  <link rel="stylesheet" href="/review.css">
  <link rel="stylesheet" href="/settings.css">
  <link rel="stylesheet" href="/health.css">
  <link rel="stylesheet" href="/goals.css">
  <link rel="stylesheet" href="/shell.css">
  <link rel="stylesheet" href="/app-icon.css">
  <link rel="stylesheet" href="/mail.css">
  <link rel="stylesheet" href="/food.css">
  <link rel="stylesheet" href="/food-body.css">
  <link rel="stylesheet" href="/scan.css">
  <link rel="stylesheet" href="/food-tools.css">
  <link rel="stylesheet" href="/food-chat.css">
  <link rel="stylesheet" href="/calendar.css">
  <link rel="stylesheet" href="/plan.css">
  <script>
    // The saved theme before the first paint (theme.js switches and saves): its stylesheet and colours. The icon is one for every theme.
    try {
      var t = JSON.parse(localStorage.getItem('oath.theme') || 'null'), d = document;
      if (t && /^[a-z]+$/.test(t.id) && t.id !== 'oath') {
        d.documentElement.setAttribute('data-theme', t.id);
        d.write('<link rel="stylesheet" id="theme-css" href="/themes/' + t.id + '.css">');
        if (/^#[0-9a-f]{6}$/i.test(t.color)) d.querySelector('meta[name="theme-color"]').content = t.color;
        if (t.light) d.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'default';
      }
    } catch (e) { /* no saved theme */ }
  </script>
</head>
<body>
  <div id="app" class="shell"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
