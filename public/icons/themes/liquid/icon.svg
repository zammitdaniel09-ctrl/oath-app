<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Smoke: slow grey swirls on black. -->
    <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0021 0.0016" numOctaves="4" seed="41" result="t"/>
      <feDisplacementMap in="t" in2="t" scale="260" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feColorMatrix in="d" values="0 0 0 0 0.86  0 0 0 0 0.86  0 0 0 0 0.9  0 0 2.1 0 -0.92"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#dfe4ff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#dfe4ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#dfe4ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Polished chrome, lit from above with a dark horizon band; the right half in darker graphite. -->
    <linearGradient id="chromeL" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="60">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#f1f1f5"/>
      <stop offset="0.4" stop-color="#b9b9c3"/>
      <stop offset="0.5" stop-color="#5a5a64"/>
      <stop offset="0.56" stop-color="#2c2c33"/>
      <stop offset="0.66" stop-color="#8e8e99"/>
      <stop offset="0.82" stop-color="#e8e8ee"/>
      <stop offset="1" stop-color="#a9a9b3"/>
    </linearGradient>
    <linearGradient id="chromeR" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="56">
      <stop offset="0" stop-color="#9a9aa4"/>
      <stop offset="0.2" stop-color="#5c5c66"/>
      <stop offset="0.42" stop-color="#26262c"/>
      <stop offset="0.52" stop-color="#0b0b0d"/>
      <stop offset="0.62" stop-color="#2e2e35"/>
      <stop offset="0.8" stop-color="#6a6a75"/>
      <stop offset="1" stop-color="#33333a"/>
    </linearGradient>
    <!-- A sideways sheen across both halves. -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="56" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="cl"><rect x="0" y="-8" width="30.8" height="80"/></clipPath>
    <clipPath id="cr"><rect x="33.2" y="-8" width="30.8" height="80"/></clipPath>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#000"/>
  <rect width="1024" height="1024" filter="url(#smoke)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <circle cx="512" cy="530" r="430" fill="url(#pool)"/>
  <circle cx="512" cy="512" r="420" fill="url(#glow)"/>

  <!-- The mark on the 64-unit grid: centre 32,32, radius 21, stroke 10.5; left half 2.8 down, right half 2.8 up. -->
  <g transform="translate(512 512) scale(11.6) translate(-32 -32)">
    <!-- Shadow under the metal. -->
    <g opacity="0.85" filter="url(#drop)" transform="translate(0 2.2)">
      <g clip-path="url(#cl)"><circle cx="32" cy="34.8" r="21" fill="none" stroke="#000" stroke-width="11"/></g>
      <g clip-path="url(#cr)"><circle cx="32" cy="29.2" r="21" fill="none" stroke="#000" stroke-width="11"/></g>
    </g>
    <!-- Left half: polished chrome. -->
    <g clip-path="url(#cl)" transform="translate(0 2.8)">
      <circle cx="32" cy="32" r="21" fill="none" stroke="url(#chromeL)" stroke-width="10.5"/>
      <circle cx="32" cy="32" r="21" fill="none" stroke="url(#sheen)" stroke-width="10.5"/>
      <circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="0.45"/>
      <circle cx="32" cy="32" r="16" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.35"/>
      <circle cx="32" cy="32" r="23.6" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="1.6"/>
    </g>
    <!-- Right half: darker graphite chrome. -->
    <g clip-path="url(#cr)" transform="translate(0 -2.8)">
      <circle cx="32" cy="32" r="21" fill="none" stroke="url(#chromeR)" stroke-width="10.5"/>
      <circle cx="32" cy="32" r="21" fill="none" stroke="url(#sheen)" stroke-width="10.5"/>
      <circle cx="32" cy="32" r="26" fill="none" stroke="#d4d4dc" stroke-opacity="0.55" stroke-width="0.45"/>
      <circle cx="32" cy="32" r="16" fill="none" stroke="#d4d4dc" stroke-opacity="0.25" stroke-width="0.35"/>
      <circle cx="32" cy="32" r="23.6" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="1.6"/>
    </g>
  </g>
</svg>
