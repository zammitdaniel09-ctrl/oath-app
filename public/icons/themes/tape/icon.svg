<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Tape: the Oath mark as a stepped tape of phosphor, amber for the word and green for the kept day, on a black screen with still scanlines. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#17110a"/>
      <stop offset="0.62" stop-color="#090705"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <pattern id="scan" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect y="7" width="12" height="4" fill="#000" fill-opacity="0.3"/>
      <rect width="12" height="1.5" fill="#ffb000" fill-opacity="0.045"/>
    </pattern>
    <linearGradient id="amb" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="60">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="0.34" stop-color="#ffc23a"/>
      <stop offset="0.62" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#d98a00"/>
    </linearGradient>
    <linearGradient id="grn" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="56">
      <stop offset="0" stop-color="#a6ffd2"/>
      <stop offset="0.4" stop-color="#2ee08a"/>
      <stop offset="1" stop-color="#16975a"/>
    </linearGradient>
    <clipPath id="L"><rect width="30.8" height="64"/></clipPath>
    <clipPath id="R"><rect x="33.2" width="30.8" height="64"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(128 128) scale(12)">
    <!-- Phosphor bloom under the halves. -->
    <g filter="url(#glow)" opacity="0.55">
      <g clip-path="url(#L)" transform="translate(0 2.8)"><circle cx="32" cy="32" r="21" fill="none" stroke="#ffb000" stroke-width="10.5"/></g>
      <g clip-path="url(#R)" transform="translate(0 -2.8)"><circle cx="32" cy="32" r="21" fill="none" stroke="#26d07c" stroke-width="10.5"/></g>
    </g>
    <!-- Dark tracks, then the lit segments. -->
    <g clip-path="url(#L)" transform="translate(0 2.8)">
      <circle cx="32" cy="32" r="21" fill="none" stroke="#1c1405" stroke-width="10.5"/>
      <circle cx="32" cy="32" r="21" fill="none" stroke="url(#amb)" stroke-width="10.5" stroke-dasharray="2.72 0.5787" transform="rotate(-90 32 32)"/>
    </g>
    <g clip-path="url(#R)" transform="translate(0 -2.8)">
      <circle cx="32" cy="32" r="21" fill="none" stroke="#0a1c12" stroke-width="10.5"/>
      <circle cx="32" cy="32" r="21" fill="none" stroke="url(#grn)" stroke-width="10.5" stroke-dasharray="2.72 0.5787" transform="rotate(-90 32 32)"/>
    </g>
    <!-- Hairline rims. -->
    <g clip-path="url(#L)" transform="translate(0 2.8)"><circle cx="32" cy="32" r="25.75" fill="none" stroke="#ffd27a" stroke-opacity="0.45" stroke-width="0.6"/></g>
    <g clip-path="url(#R)" transform="translate(0 -2.8)"><circle cx="32" cy="32" r="25.75" fill="none" stroke="#8affc4" stroke-opacity="0.45" stroke-width="0.6"/></g>
  </g>
  <rect width="1024" height="1024" fill="url(#scan)"/>
</svg>
